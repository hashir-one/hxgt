[versions]
agp = "9.0.1"
kotlin = "2.2.10"
ksp = "2.3.12"
compose = "2025.08.01"
activity = "1.11.0"
room = "2.8.4"
work = "2.10.5"
okhttp = "4.12.0"
coroutines = "1.10.2"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
re2j = { module = "com.google.re2j:re2j", version = "1.8" }
scanner = { module = "com.journeyapps:zxing-android-embedded", version = "4.3.0" }
junit = { module = "junit:junit", version = "4.13.2" }
json = { module = "org.json:json", version = "20250517" }
android-test-runner = { module = "androidx.test:runner", version = "1.6.2" }
android-test-junit = { module = "androidx.test.ext:junit", version = "1.2.1" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
